name: 编译 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 计算构建版本号（每次构建递增，确保 TrollStore 覆盖安装生效）
        id: ver
        run: |
          echo "MARKETING_VERSION=1.$(date -u +%y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "CURRENT_PROJECT_VERSION=$(date -u +%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（无签名）
        run: |
          xcodebuild \
            -project QBRemote.xcodeproj \
            -scheme QBRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.MARKETING_VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.CURRENT_PROJECT_VERSION }}" \
            build

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/QBRemote.app" Payload/
          zip -r QBRemote.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: QBRemote-ipa
          path: QBRemote.ipa
