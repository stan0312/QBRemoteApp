name: QBRemote
options:
  createIntermediateGroups: true
packages:
  MobileVLCKit:
    url: https://github.com/showbie/MobileVLCKit-SPM
    from: 3.7.3
targets:
  QBRemote:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - QBRemote
    dependencies:
      - package: MobileVLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qbremote.app
        INFOPLIST_FILE: QBRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
